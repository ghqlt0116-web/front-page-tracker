name: collect

on:
  schedule:
    # GitHub 스케줄은 혼잡 시간대(정각·30분)에 1~2시간 지연되므로,
    # 어중간한 분을 쓰고 여유를 두어 지연돼도 KST 08:00 전에 발송되게 한다
    # GitHub 무료 스케줄은 수 시간 지연·통째 스킵이 잦아(2026-11-03 실측) 슬롯을 넓게 깐다.
    # 같은 날짜 재실행은 업서트이고 다이제스트는 상태 파일로 중복 발송이 방지되므로 몇 번 돌아도 무해.
    - cron: "33 19 * * *" # KST 04:33
    - cron: "3 20 * * *"  # KST 05:03 — 다이제스트 1차
    - cron: "51 20 * * *" # KST 05:51
    - cron: "41 21 * * *" # KST 06:41 — 보강 2차
    - cron: "19 22 * * *" # KST 07:19 — 예비
  workflow_dispatch:
    inputs:
      date:
        description: "수집 기준일 YYYYMMDD (비우면 KST 오늘)"
        required: false
      days:
        description: "기준일부터 거슬러 올라갈 일수 (백필)"
        required: false
        default: "1"
      notify:
        description: "텔레그램 발송 여부"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS="--days ${{ inputs.days || 1 }}"
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          # 스케줄 실행은 항상 발송, 수동 실행은 notify 입력을 따름
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.notify }}" = "true" ]; then ARGS="$ARGS --notify"; fi
          python run.py $ARGS

      - name: Commit data
        run: |
          git config user.name "front-page-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +%F_%H:%M) 수집"
            git pull --rebase origin main
            git push
          fi
